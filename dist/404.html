<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayfa Bulunamadı — Karşıyaka Ne Karar Verdi?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7f4;color:#14231e;font-family:'Inter',system-ui,sans-serif;text-align:center;padding:24px}
    .code{font-size:8rem;font-weight:800;letter-spacing:-.08em;color:#0b6047;line-height:1;margin-bottom:8px}
    h1{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;margin:0 0 12px}
    p{color:#607069;max-width:400px;margin:0 auto 24px;line-height:1.6}
    a{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:#0b6047;color:#fff;text-decoration:none;border-radius:12px;font-weight:600;transition:.15s ease}
    a:hover{background:#094e3a}
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>Sayfa bulunamadı</h1>
    <p>Aradığınız sayfa taşınmış veya kaldırılmış olabilir. Ana sayfadan devam edebilirsiniz.</p>
    <a href="/">← Ana sayfaya dön</a>
  </div>
</body>
</html>
