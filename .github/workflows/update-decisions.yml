name: Kararları Güncelle

on:
  # Her Pazartesi ve Cuma sabah 09:00 (TR saati, UTC+3 → UTC 06:00)
  schedule:
    - cron: '0 6 * * 1,5'
  # GitHub'dan elle tetikleme
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repoyu klonla
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: pdftotext kur (poppler-utils)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Veri kontrollerini çalıştır
        run: npm test

      - name: Kararları çek ve güncelle
        run: node scripts/import-decisions.mjs
        env:
          NODE_OPTIONS: '--experimental-fetch'

      - name: Değişiklik varsa commit + push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/data/decisions.json dist/data/status.json
          if git diff --cached --quiet; then
            echo "📭 Yeni karar yok, değişiklik yapılmadı."
          else
            KARAR_SAYISI=$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/data/decisions.json','utf8')).length)")
            git commit -m "veri: otomatik güncelleme — ${KARAR_SAYISI} karar"
            git push
            echo "✅ ${KARAR_SAYISI} karar güncellendi ve push edildi."
          fi
